services:
  target-manager-prometheus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: target-manager-prometheus
    restart: unless-stopped

    ports:
      - "${PORT:-9089}:${PORT:-9089}"
    depends_on:
      - prometheus
    volumes:
      - ${TARGETS_PATH:-/etc/prometheus/targets}:/etc/prometheus/targets
        #cartella target condivisa
      - sd_targets:/etc/prometheus/targets
    # Variabili d'ambiente passate al container
    environment:
      - PORT=${PORT:-9089}
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # - '--storage.tsdb.retention.time=15d'
      # - '--storage.tsdb.retention.size=10GB'
      # - '--web.enable-lifecycle'
    volumes:
      - ${PROMETHEUS_YML}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
        #cartella target condivisa, prometheus ha permessi read only
      - sd_targets:/etc/prometheus/file_sd:ro


volumes:
  sd_targets: